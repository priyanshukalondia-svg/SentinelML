# Reference copy of the tunables in backend/app/core/config.py, expressed as
# YAML for readability (SYSTEM_REQUIREMENTS.md Section 37). The application
# itself reads these from environment variables (see .env.example) — this
# file is documentation, not consumed directly by the backend.

monitoring:
  interval_seconds: 60

drift:
  warning_threshold: 0.10
  critical_threshold: 0.25

promotion:
  metric: f1
  minimum_improvement: 0.02
  maximum_latency_increase_percent: 10

rollback:
  max_error_rate: 0.05
  minimum_health_score: 70

training:
  timeout_seconds: 900
  retraining_cooldown_seconds: 300
